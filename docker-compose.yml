services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homehub}
      POSTGRES_DB: ${POSTGRES_DB:-homehub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homehub} -d ${POSTGRES_DB:-homehub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-homehub}:${POSTGRES_PASSWORD:-homehub}@db:5432/${POSTGRES_DB:-homehub}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
